name: Safety regression

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      xboard_smoke:
        description: Also install real Xboard and NPM in a disposable runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
  docker-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo env XB_DISPOSABLE_DOCKER_TEST=1 python3 tests/integration_docker.py
  xboard-smoke:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.xboard_smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo env XB_DISPOSABLE_DOCKER_TEST=1 bash tests/smoke_vps.sh
